<p class="experience-status">

    <button type="button"
            class="button button-secondary"
            popovertarget="delete-education-{{ education.id }}">
        Hapus
    </button>

</p>

<div id="delete-education-{{ education.id }}"
     class="project-delete-modal"
     popover="auto">

    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-education-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup">
    </button>

    <div class="project-delete-modal__content">

        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-education-{{ education.id }}"
                popovertargetaction="hide">
            ×
        </button>

        <h2>Hapus Education?</h2>

        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ education.institution }}</strong>?
        </p>

        <div class="project-delete-modal__actions">

            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-education-{{ education.id }}"
                    popovertargetaction="hide">
                Batal
            </button>

            <form method="post"
                  action="{% url 'main:delete_education' education.id %}">

                {% csrf_token %}

                <button type="submit"
                        class="button button-secondary">
                    Ya, Hapus
                </button>

            </form>

        </div>

    </div>

</div>
